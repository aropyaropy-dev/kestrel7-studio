name: Extract Android Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract Android project
        run: |
          mkdir -p temp

          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP project tidak ditemukan"
            exit 1
          fi

          unzip -o "$ZIP_FILE" -d temp

          PROJECT_DIR=$(find temp -name settings.gradle -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "File settings.gradle tidak ditemukan"
            exit 1
          fi

          rsync -a --exclude='.github/' "$PROJECT_DIR"/ ./

      - name: Save Android files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app build.gradle gradle.properties settings.gradle

          git commit -m "Add Kestrel Android project" || true

          git push
          
