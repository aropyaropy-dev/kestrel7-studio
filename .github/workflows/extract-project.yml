
name: Extract Kestrel7 V3 Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip rsync

      - name: Extract V3 project
        run: |
          set -e

          ZIP_FILE="./Kestrel7_Studio_Adult_v3.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP V3 tidak ditemukan!"
            echo "Daftar ZIP:"
            find . -maxdepth 1 -name "*.zip"
            exit 1
          fi

          mkdir -p temp
          unzip -o "$ZIP_FILE" -d temp

          SETTINGS_FILE=$(find temp -name settings.gradle -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle tidak ditemukan"
            exit 1
          fi

          ANDROID_DIR=$(dirname "$SETTINGS_FILE")
          PROJECT_ROOT=$(dirname "$ANDROID_DIR")

          if [ ! -d "$PROJECT_ROOT/backend" ]; then
            echo "ERROR: Folder backend tidak ditemukan"
            find temp -maxdepth 3 -type d
            exit 1
          fi

          echo "Menyalin proyek Android..."
          rsync -a --exclude='.github/' "$ANDROID_DIR"/ ./

          echo "Menyalin backend..."
          mkdir -p backend
          rsync -a "$PROJECT_ROOT/backend"/ backend/

          echo "Membersihkan file sementara..."
          rm -rf temp

          echo "Proyek V3 berhasil diekstrak"

      - name: Save project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Extract Kestrel7 Adult V3 project" || true
          git push
          
