
name: Extract Kestrel7 V3 Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip rsync

          mkdir -p temp

          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP project tidak ditemukan"
            exit 1
          fi

          unzip -o "$ZIP_FILE" -d temp

          SETTINGS_FILE=$(find temp -name settings.gradle -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "settings.gradle tidak ditemukan"
            exit 1
          fi

          ANDROID_DIR=$(dirname "$SETTINGS_FILE")
          PROJECT_ROOT=$(dirname "$ANDROID_DIR")

          rsync -a --exclude='.github/' "$ANDROID_DIR"/ ./

          if [ -d "$PROJECT_ROOT/backend" ]; then
            mkdir -p backend
            rsync -a "$PROJECT_ROOT/backend"/ backend/
          else
            echo "Folder backend tidak ditemukan"
            exit 1
          fi

          rm -rf temp

      - name: Save project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Extract Kestrel7 Adult V3 project" || true
          git push
          
